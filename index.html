<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="منظم الفلوس" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>مُنظِّم حياتك وفلوسك — Mohamed Nazih — الإصدار التجاري</title>
    <meta name="description" content="تطبيق منظم حياتك وفلوسك لإدارة الأموال، الديون، الأقساط، الفواتير والاشتراكات" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Anti-White-Screen Recovery System
      window.__appLoaded = false;
      function __cleanAndReload() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
        } catch (e) {}
        window.location.reload();
      }

      window.addEventListener('error', function(e) {
        console.warn('Unhandled resource or script error:', e);
        var msg = (e && e.message) ? e.message : '';
        // If a dynamic import fails (common after new deployment), auto reload
        if (msg.indexOf('dynamically imported module') !== -1 || msg.indexOf('Loading chunk') !== -1) {
          __cleanAndReload();
        }
      });

      // Watchdog: If #root is still blank after 4 seconds, show emergency rescue UI
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && (!root.firstElementChild || root.innerHTML.trim() === '')) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;padding:20px;font-family:Cairo,sans-serif;direction:rtl;text-align:center;">' +
            '<div style="max-width:400px;width:100%;background:#1e293b;padding:24px;border-radius:18px;box-shadow:0 20px 40px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);">' +
            '<div style="font-size:36px;margin-bottom:12px;">📱</div>' +
            '<h3 style="font-size:17px;font-weight:800;margin-bottom:8px;color:#fff;">مُنظِّم حياتك وفلوسك</h3>' +
            '<p style="font-size:12.5px;color:#94a3b8;line-height:1.6;margin-bottom:18px;">تم تحديث نسخة التطبيق! اضغط أدناه لمسح الكاش وفتح التطبيق فوراً:</p>' +
            '<button onclick="__cleanAndReload()" style="width:100%;padding:12px;border-radius:10px;background:#1877F2;color:#fff;border:none;font-weight:800;font-size:13.5px;cursor:pointer;margin-bottom:10px;">🔄 تحديث ومسح الذاكرة المؤقتة</button>' +
            '<button onclick="localStorage.setItem(\'plm_device_registered\',\'1\');localStorage.setItem(\'plm_name\',\'صاحب الجهاز\');localStorage.setItem(\'plm_onboarded\',\'1\');location.reload();" style="width:100%;padding:10px;border-radius:10px;background:#334155;color:#e2e8f0;border:none;font-weight:700;font-size:12px;cursor:pointer;">⚡ فتح التطبيق مباشرة</button>' +
            '</div></div>';
        }
      }, 3500);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
